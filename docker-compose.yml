services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: attendo
      POSTGRES_USER: attendo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
    volumes: ["attendo_db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attendo -d attendo"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://attendo:${POSTGRES_PASSWORD:-change-this-local-password}@db:5432/attendo
      JWT_SECRET: ${JWT_SECRET:-DEV-ONLY-change-this-secret}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  attendo_db:
